<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Crear cuenta - CSYOP</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="header">
    <div class="logo">CSYOP</div>
</header>


<main class="auth-container">

    <div class="auth-card">

        <h1>Crear cuenta</h1>

        <p class="auth-subtitle">
            Regístrate para gestionar tus citas médicas.
        </p>


        <form id="registroForm">

            <div class="form-group">

                <label for="nombre">
                    Nombre completo
                </label>

                <input
                    type="text"
                    id="nombre"
                    name="nombre"
                    placeholder="Ingresa tu nombre completo"
                    required
                >

            </div>


            <div class="form-group">

                <label for="cedula">
                    Cédula
                </label>

                <input
                    type="text"
                    id="cedula"
                    name="cedula"
                    placeholder="Ingresa tu número de cédula"
                    required
                >

            </div>


            <div class="form-group">

                <label for="telefono">
                    Teléfono
                </label>

                <input
                    type="tel"
                    id="telefono"
                    name="telefono"
                    placeholder="Ingresa tu número de teléfono"
                    required
                >

            </div>


            <div class="form-group">

                <label for="direccion">
                    Dirección
                </label>

                <input
                    type="text"
                    id="direccion"
                    name="direccion"
                    placeholder="Ingresa tu dirección"
                    required
                >

            </div>


            <div class="form-group">

                <label for="correo">
                    Correo electrónico
                </label>

                <input
                    type="email"
                    id="correo"
                    name="correo"
                    placeholder="correo@ejemplo.com"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Contraseña
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Crea una contraseña"
                    required
                >

            </div>


            <button
                type="submit"
                class="btn-primary">
                Crear cuenta
            </button>

        </form>


        <p
            id="mensajeRegistro"
            class="login-message">
        </p>


        <p class="auth-register">

            ¿Ya tienes una cuenta?

            <a href="login.html">
                Iniciar sesión
            </a>

        </p>

    </div>

</main>


<footer class="footer">

    <p>
        © 2026 CSYOP - Sistema de Citas Médicas de Yopal
    </p>

</footer>


<script src="js/app.js"></script>

</body>

</html>
